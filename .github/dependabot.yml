# Weekly update PRs for dev dependencies and for the Actions the workflows use.
# Each one has to pass the same CI as any other change before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps arrive together in one PR. A major bump is left out of
      # the group, so each one gets its own PR and is taken on its own (#30, #31).
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the Node major we support (engines: >=22.18). Newer
      # majors' types would let code typecheck against APIs Node 22 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
